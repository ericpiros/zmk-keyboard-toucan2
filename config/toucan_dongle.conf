# Enable Split Central with 2 peripheral halves
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Trackpad / Mouse support (receives split pointing events from peripheral)
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# Allow 2 peripherals + host devices
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# Battery reporting from peripherals
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# RGB LED widget for dongle (blinks battery level of connected peripherals on the Xiao BLE onboard LED)
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_PERIPHERALS=y

# Dongle is USB-powered; disable deep sleep
CONFIG_ZMK_SLEEP=n

